<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Diseño responsive: la app se adapta a móvil y escritorio -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captions Reader</title>
  <meta name="description" content="Lector de subtítulos .srt: navega, busca, reproduce y escucha subtítulos, también sin conexión." />
  <meta name="theme-color" content="#1D1E18" />

  <!-- PWA: instalable y usable sin conexión (solo al servirse por http/https) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Tipografías: Fraunces (display, carácter cinematográfico) + Hanken Grotesk (cuerpo legible) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="icon" type="image/png" href="CaptionsReader-Icon.ico">
</head>

<body>
  <!-- Capa decorativa de grano/textura para dar atmósfera (puramente visual) -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ============ ENCABEZADO / MARCA ============ -->
  <header class="app-header">
    <div class="brand">
      <!-- Glifo decorativo tipo "marcador de pantalla" -->
      <span class="brand__mark" aria-hidden="true">❒</span>
      <h1 class="brand__name">Captions&nbsp;Reader</h1>
    </div>
    <p class="brand__tagline" id="tagline">Lector de subtítulos · formato .srt</p>

    <!-- Solo aparece cuando el navegador permite instalar la app (PWA) -->
    <button class="install" id="installBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Instalar app
    </button>
  </header>

  <!-- ============ ESCENARIO PRINCIPAL ============ -->
  <main class="stage">

    <!-- ---------- ESTADO 1: ZONA DE CARGA ----------
         Es lo único interactivo al entrar/refrescar la página. -->
    <section class="uploader" id="uploader" aria-label="Cargar archivo de subtítulos">
      <!--
        El <label> envuelve el <input file>. Así, todo el recuadro
        es clicable y además sirve como objetivo para arrastrar y soltar.
      -->
      <label class="dropzone" id="dropzone" for="fileInput">
        <span class="dropzone__icon" aria-hidden="true">↧</span>
        <span class="dropzone__title">Arrastra tu archivo <strong>.srt</strong></span>
        <span class="dropzone__hint">o haz clic para buscarlo en tu equipo</span>

        <!-- Input real (se estiliza desde CSS; sigue siendo accesible) -->
        <input
          class="dropzone__input"
          type="file"
          id="fileInput"
          accept=".srt,text/plain"
        />
      </label>

      <!-- Zona reservada para mensajes de error (vacía por defecto).
           role="alert" hace que los lectores de pantalla la anuncien. -->
      <p class="uploader__error" id="error" role="alert"></p>

      <!-- Archivos abiertos recientemente (IndexedDB). Oculto si no hay. -->
      <section class="recents" id="recents" aria-labelledby="recentsTitle" hidden>
        <h2 class="recents__title" id="recentsTitle">Recientes</h2>
        <ul class="recents__list" id="recentsList"></ul>
      </section>
    </section>

    <!-- ---------- ESTADO 2: CONTROLADOR DE SUBTÍTULOS ----------
         Inicia oculto con "hidden". JS lo revela tras cargar el .srt. -->
    <section class="reader" id="reader" aria-label="Controlador de subtítulos" hidden>

      <!-- Botón anterior (flecha izquierda) -->
      <button class="nav nav--prev" id="prevBtn" type="button" aria-label="Subtítulo anterior">
        <span aria-hidden="true">‹</span>
      </button>

      <!-- Tarjeta central: aquí vive el subtítulo actual -->
      <article class="caption-card">
        <!-- Metadatos: marca de tiempo + contador (índice / total) -->
        <div class="caption-card__meta">
          <span class="caption-card__time" id="timecode">00:00:00,000 → 00:00:00,000</span>
          <!-- Reloj de la reproducción temporizada (solo mientras reproduce) -->
          <span class="caption-card__clock" id="playClock" hidden></span>
          <span class="caption-card__counter" id="counter">0 / 0</span>
        </div>

        <!-- Texto del subtítulo. aria-live="polite": al cambiar, se anuncia. -->
        <p class="caption-card__text" id="captionText" aria-live="polite"></p>

        <!-- Barra de progreso a lo largo de la línea de tiempo del archivo -->
        <div class="progress" role="progressbar" aria-label="Progreso del archivo">
          <div class="progress__bar" id="progressBar"></div>
        </div>

        <!-- Barra de reproducción: play/pausa, velocidad y lectura en voz alta -->
        <div class="playbar" role="group" aria-label="Reproducción">
          <button class="action action--play" id="playBtn" type="button"
                  title="Reproducir / pausar (P)">
            <svg class="action__icon" id="playIcon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M8 5v14l11-7z" fill="currentColor"/>
            </svg>
            <svg class="action__icon" id="pauseIcon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" hidden>
              <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>
            </svg>
            <span class="action__label" id="playLabel">Reproducir</span>
          </button>

          <label class="speed" title="Velocidad de la reproducción y de la voz">
            <span class="visually-hidden">Velocidad</span>
            <select class="speed__select" id="speedSelect">
              <option value="0.5">0,5×</option>
              <option value="0.75">0,75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1,25×</option>
              <option value="1.5">1,5×</option>
              <option value="2">2×</option>
            </select>
          </label>

          <!-- Oculto si el navegador no tiene síntesis de voz -->
          <button class="action" id="voiceBtn" type="button" aria-pressed="false"
                  title="Leer en voz alta (V)" hidden>
            <svg class="action__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="action__label">Voz</span>
          </button>
        </div>

        <!-- Fila de acciones: copiar, saltar a una marca de tiempo y transcripción -->
        <div class="caption-card__actions">
          <!-- Botón para copiar el texto del subtítulo actual al portapapeles -->
          <button class="action" id="copyBtn" type="button" aria-label="Copiar subtítulo actual">
            <!-- Ícono de portapapeles (SVG inline, sin dependencias) -->
            <svg class="action__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"
                    fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                    fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span class="action__label" id="copyLabel">Copiar</span>
          </button>

          <!-- Botón para abrir el modal de salto por marca de tiempo -->
          <button class="action" id="jumpBtn" type="button" aria-label="Saltar a una marca de tiempo">
            <!-- Ícono de reloj (SVG inline) -->
            <svg class="action__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M12 7v5l3 2" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="action__label">Saltar a</span>
          </button>

          <!-- Muestra/oculta la transcripción completa con búsqueda -->
          <button class="action" id="transcriptBtn" type="button" aria-expanded="false"
                  aria-controls="transcript" title="Transcripción (T)">
            <svg class="action__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="action__label">Transcripción</span>
          </button>
        </div>
      </article>

      <!-- Botón siguiente (flecha derecha) -->
      <button class="nav nav--next" id="nextBtn" type="button" aria-label="Subtítulo siguiente">
        <span aria-hidden="true">›</span>
      </button>

      <!-- Transcripción completa: lista de todos los subtítulos con búsqueda -->
      <section class="transcript" id="transcript" aria-label="Transcripción" hidden>
        <div class="transcript__bar">
          <svg class="transcript__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input class="transcript__search" id="transcriptSearch" type="search"
                 placeholder="Buscar en los subtítulos…" aria-label="Buscar en los subtítulos"
                 aria-describedby="transcriptCount" autocomplete="off" spellcheck="false" />
          <span class="transcript__count" id="transcriptCount" aria-live="polite"></span>
        </div>
        <!-- Lista completa y, mientras se busca, la lista de resultados -->
        <ol class="transcript__list" id="transcriptList"></ol>
        <ol class="transcript__list" id="transcriptResults" aria-label="Resultados de la búsqueda" hidden></ol>
      </section>

      <!-- Acción secundaria: volver al estado de carga -->
      <button class="reset" id="resetBtn" type="button">↺ Cargar otro archivo</button>
    </section>

  </main>

  <!-- ============ MODAL: SALTAR A MARCA DE TIEMPO ============
       <dialog> nativo abierto con showModal(): aporta foco atrapado,
       fondo inerte, cierre con Escape y devolución del foco al cerrar.
       El fondo oscuro es su pseudo-elemento ::backdrop (ver CSS). -->
  <dialog class="modal" id="jumpModal" aria-labelledby="jumpTitle">
    <!-- method="dialog": cada botón cierra el diálogo y deja su "value"
         en dialog.returnValue ("cancel" u "ok"). -->
    <form class="modal__dialog" method="dialog">
      <h2 class="modal__title" id="jumpTitle">Saltar a marca de tiempo</h2>
      <p class="modal__hint">Gira las ruedas (o usa ↑ ↓ ← →) para elegir <strong>hora&nbsp;:&nbsp;min&nbsp;:&nbsp;seg</strong></p>

      <!-- Selector de tiempo estilo iOS (tres rodillos cilíndricos) -->
      <div class="picker" id="timePicker">
        <!-- Zona de enfoque central (franja con líneas y desenfoque) -->
        <div class="picker__focus" aria-hidden="true"></div>
        <!-- Anillo que marca la rueda activa (lo mueve JavaScript) -->
        <div class="picker__ring" id="wheelRing" aria-hidden="true"></div>

        <!-- Cada .wheel recibe sus números por JavaScript.
             "autofocus": al abrir, el foco empieza en la rueda de horas. -->
        <div class="wheel" id="wheelHours" data-unit="horas"
             role="slider" aria-label="Horas" tabindex="0" autofocus></div>
        <span class="picker__sep" aria-hidden="true">:</span>
        <div class="wheel" id="wheelMinutes" data-unit="minutos"
             role="slider" aria-label="Minutos" tabindex="0"></div>
        <span class="picker__sep" aria-hidden="true">:</span>
        <div class="wheel" id="wheelSeconds" data-unit="segundos"
             role="slider" aria-label="Segundos" tabindex="0"></div>
      </div>

      <!-- Botones de acción -->
      <div class="modal__actions">
        <button class="modal__btn modal__btn--ghost" value="cancel">Cancelar</button>
        <button class="modal__btn modal__btn--solid" value="ok">Aceptar</button>
      </div>
    </form>
  </dialog>

  <!-- ============ AVISO FLOTANTE (toast) ============
       La región role="status" está siempre presente para que los lectores
       de pantalla anuncien los mensajes al aparecer. -->
  <div class="toast-region" role="status" aria-live="polite">
    <div class="toast" id="toast" hidden>
      <span class="toast__text" id="toastText"></span>
      <button class="toast__action" id="toastAction" type="button" hidden></button>
    </div>
  </div>

  <!-- Scripts clásicos con "defer": se ejecutan en orden, con el DOM ya listo.
       El "?v=N" de CSS y JS evita que el navegador mezcle este HTML con
       versiones antiguas guardadas en caché (GitHub Pages las cachea unos
       minutos). Hay que subir el número cada vez que se publiquen cambios.
       captions-core.js (lógica pura) va primero porque app.js usa sus funciones;
       las funcionalidades de features/ van después porque usan la API de app.js.
       Al no usar import/export, funciona al abrir el .html directamente
       (sin servidor local ni problemas de CORS por file://). -->
  <script src="captions-core.js?v=5" defer></script>
  <script src="app.js?v=5" defer></script>
  <script src="features/recents.js?v=5" defer></script>
  <script src="features/playback.js?v=5" defer></script>
  <script src="features/transcript.js?v=5" defer></script>
  <script src="features/speech.js?v=5" defer></script>
  <script src="features/pwa.js?v=5" defer></script>
</body>
</html>
